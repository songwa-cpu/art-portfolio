<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — Rasta Roba</title>
<meta name="description" content="Stories, reflections, and updates from Rasta Roba's studio.">
<link rel="canonical" href="https://art.dwatamon.com/blog.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c0b0a'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='16' fill='%23d99a63' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c0b0a; --cream:#f2ebdb; --muted:#8a8676;
    --c1a:#7a4a2c; --c1b:#2a1a11;
    --c2a:#3f5a4a; --c2b:#15211b;
    --c3a:#4a4270; --c3b:#181630;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Archivo',system-ui,sans-serif;background:var(--ink);color:var(--cream);line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:0 40px}
  a{color:inherit;text-decoration:none}

  .topnav{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:20px 40px;background:linear-gradient(to bottom, rgba(12,11,10,.85), transparent);backdrop-filter:blur(6px)}
  .topnav .brand{font-family:'Fraunces',serif;font-style:italic;font-size:1rem;letter-spacing:.02em}
  .topnav .links{display:flex;gap:28px;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase}
  .topnav .links a{opacity:.7;transition:opacity .2s}
  .topnav .links a:hover,.topnav .links a.active{opacity:1}

  .hero{padding:150px 0 60px;text-align:center;background:radial-gradient(120% 100% at 50% 0%,#1c140d 0%,#0c0b0a 60%)}
  .eyebrow{font-size:.75rem;letter-spacing:.4em;text-transform:uppercase;color:var(--muted);margin-bottom:26px}
  .hero h1{font-family:'Fraunces',serif;font-weight:300;font-size:clamp(2rem,5vw,3.4rem);color:#efe6cf}

  .posts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:30px;padding:60px 0 100px}
  .post{border:1px solid rgba(255,255,255,.08);border-radius:8px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.02),transparent)}
  .post .cover{aspect-ratio:16/10;background-size:cover;background-position:center}
  .post .body{padding:24px 26px 28px}
  .post .date{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .post h2{font-family:'Fraunces',serif;font-weight:400;font-size:1.25rem;margin-bottom:10px}
  .post p{font-size:.9rem;color:rgba(242,235,219,.78)}

  .empty{text-align:center;padding:40px 0 140px}
  .empty p{font-family:'Fraunces',serif;font-style:italic;font-weight:300;color:var(--muted);font-size:1.15rem;max-width:34ch;margin:0 auto}

  .foot{text-align:center;padding:30px;font-size:.72rem;color:#5c5850;letter-spacing:.06em;border-top:1px solid #1a1814}
  @media(max-width:640px){
    .topnav{padding:16px 20px}
    .topnav .links{gap:14px;font-size:.6rem}
    .wrap{padding:0 24px}
  }
</style>
<script data-goatcounter="https://dwatamon.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<nav class="topnav">
  <a class="brand" href="index.html">Rasta Roba</a>
  <div class="links">
    <a href="index.html">Work</a>
    <a href="services.html">Services</a>
    <a href="shop.html">Shop</a>
    <a href="blog.html" class="active">Blog</a>
    <a href="about.html">About</a>
  </div>
</nav>

<header class="hero">
  <div class="eyebrow">Rasta Roba · Journal</div>
  <h1>Stories from the studio.</h1>
</header>

<section class="wrap">
  <div class="posts" id="posts"></div>
  <div class="empty" id="empty">
    <p>New stories are on their way. Check back soon.</p>
  </div>
</section>

<div class="foot">© Rasta Roba — Studio.</div>

<script>
  // Add new posts here — newest first. Each becomes a card automatically.
  const posts = [
    // { date: "March 2026", title: "Post title", excerpt: "One or two sentences.", cover: "images/blog/example.jpg" },
  ];
  const postsEl = document.getElementById('posts');
  const emptyEl = document.getElementById('empty');
  if(posts.length){
    emptyEl.style.display = 'none';
    posts.forEach(p=>{
      const grad = 'linear-gradient(160deg,var(--c1a),var(--c1b))';
      postsEl.insertAdjacentHTML('beforeend', `
        <div class="post">
          <div class="cover" style="background-image:url('${p.cover}'),${grad}"></div>
          <div class="body">
            <div class="date">${p.date}</div>
            <h2>${p.title}</h2>
            <p>${p.excerpt}</p>
          </div>
        </div>`);
    });
  }
</script>
</body>
</html>
