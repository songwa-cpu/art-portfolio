<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modeling — Rasta Roba</title>
<meta name="description" content="Rasta Roba's modeling portfolio and measurements.">
<link rel="canonical" href="https://art.dwatamon.com/modeling.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c0b0a'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='16' fill='%23d99a63' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c0b0a; --cream:#f2ebdb; --muted:#8a8676;
    --c3a:#4a4270; --c3b:#181630;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Archivo',system-ui,sans-serif;background:var(--ink);color:var(--cream);line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:0 40px}
  a{color:inherit;text-decoration:none}

  .topnav{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:20px 40px;background:linear-gradient(to bottom, rgba(12,11,10,.85), transparent);backdrop-filter:blur(6px)}
  .topnav .brand{font-family:'Fraunces',serif;font-style:italic;font-size:1rem;letter-spacing:.02em}
  .topnav .links{display:flex;gap:28px;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase}
  .topnav .links a{opacity:.7;transition:opacity .2s}
  .topnav .links a:hover,.topnav .links a.active{opacity:1}

  .back{display:inline-block;margin:110px 0 20px;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .hero{padding:10px 0 50px;text-align:center}
  .eyebrow{font-size:.75rem;letter-spacing:.4em;text-transform:uppercase;color:var(--muted);margin-bottom:26px}
  .hero h1{font-family:'Fraunces',serif;font-weight:300;font-size:clamp(2rem,5vw,3.2rem);color:#efe6cf}

  .measurements{max-width:640px;margin:0 auto 90px;border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:36px 40px}
  .measurements h2{font-family:'Fraunces',serif;font-style:italic;font-weight:300;font-size:1.2rem;margin-bottom:22px;text-align:center;color:var(--muted)}
  .measurements table{width:100%;border-collapse:collapse}
  .measurements td{padding:11px 4px;border-bottom:1px solid rgba(255,255,255,.06);font-size:.92rem}
  .measurements td:first-child{color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-size:.72rem}
  .measurements td:last-child{text-align:right;font-family:'Fraunces',serif;font-style:italic}

  .gallery{columns:3 220px;column-gap:16px;padding-bottom:120px}
  .shot{width:100%;display:block;margin:0 0 16px;border-radius:6px;border:1px solid rgba(255,255,255,.08);cursor:zoom-in;transition:transform .3s;break-inside:avoid}
  .shot:hover{transform:translateY(-5px)}
  @media(max-width:640px){.gallery{columns:2 160px}}

  .cta{padding:0 0 130px;text-align:center}
  .cta a{display:inline-block;border:1px solid rgba(242,235,219,.4);border-radius:100px;padding:15px 34px;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;transition:background .3s,color .3s}
  .cta a:hover{background:var(--cream);color:var(--ink)}

  .foot{text-align:center;padding:30px;font-size:.72rem;color:#5c5850;letter-spacing:.06em;border-top:1px solid #1a1814}

  .lightbox{position:fixed;inset:0;background:rgba(6,5,4,.94);display:none;align-items:center;justify-content:center;z-index:100;padding:30px;cursor:zoom-out}
  .lightbox.open{display:flex}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  @media(max-width:640px){
    .topnav{padding:16px 20px}
    .topnav .links{gap:14px;font-size:.6rem}
    .wrap{padding:0 24px}
    .measurements{padding:28px 24px}
  }
</style>
</head>
<body>
<nav class="topnav">
  <a class="brand" href="index.html">Rasta Roba</a>
  <div class="links">
    <a href="index.html">Work</a>
    <a href="services.html" class="active">Services</a>
    <a href="shop.html">Shop</a>
    <a href="blog.html">Blog</a>
    <a href="about.html">About</a>
  </div>
</nav>

<div class="wrap">
  <a class="back" href="services.html">← Services</a>
  <header class="hero">
    <div class="eyebrow">Modeling</div>
    <h1>Rasta Roba</h1>
  </header>

  <div class="measurements">
    <h2>Measurements</h2>
    <table>
      <tr><td>Height</td><td>5'10"</td></tr>
      <tr><td>Bust</td><td>40 in</td></tr>
      <tr><td>Waist</td><td>34 in</td></tr>
      <tr><td>Hips</td><td>43 in</td></tr>
      <tr><td>Dress size</td><td>Medium to Large</td></tr>
      <tr><td>Shoe size</td><td>US 9</td></tr>
      <tr><td>Hair color</td><td>Brown</td></tr>
      <tr><td>Eye color</td><td>Brown</td></tr>
    </table>
  </div>

  <div class="gallery" id="gallery"></div>

  <div class="cta">
    <a href="mailto:mangement@dwatamon.com?subject=Modeling Booking Inquiry">Book Rasta Roba →</a>
  </div>
</div>

<div class="foot">© Rasta Roba — Studio.</div>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('open')">
  <img src="" alt="">
</div>

<script>
  const shots = 8;
  const gallery = document.getElementById('gallery');
  for(let i=1;i<=shots;i++){
    const photo = `images/modeling/${i}.jpg`;
    gallery.insertAdjacentHTML('beforeend', `<img class="shot" src="${photo}" data-src="${photo}" alt="Rasta Roba modeling photo ${i}" onclick="openLightbox(this)" onerror="this.remove()">`);
  }
  function openLightbox(el){
    const src = el.dataset.src;
    if(!src) return;
    const lb = document.getElementById('lightbox');
    lb.querySelector('img').src = src;
    lb.classList.add('open');
  }
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape') document.getElementById('lightbox').classList.remove('open');
  });
</script>
</body>
</html>
