<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — Rasta Roba</title>
<meta name="description" content="The team behind Rasta Roba's work.">
<link rel="canonical" href="https://art.dwatamon.com/about.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c0b0a'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='16' fill='%23d99a63' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c0b0a; --cream:#f2ebdb; --muted:#8a8676;
    --c1a:#7a4a2c; --c1b:#2a1a11;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Archivo',system-ui,sans-serif;background:var(--ink);color:var(--cream);line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:0 40px}
  a{color:inherit;text-decoration:none}

  .ver{position:fixed;top:14px;right:14px;background:rgba(242,235,219,.12);color:#efe6cf;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;padding:8px 13px;border-radius:100px;z-index:9;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.1)}

  .hero{padding:140px 0 60px;text-align:center;background:radial-gradient(120% 100% at 50% 0%,#1c140d 0%,#0c0b0a 60%)}
  .eyebrow{font-size:.75rem;letter-spacing:.4em;text-transform:uppercase;color:var(--muted);margin-bottom:26px}
  .hero h1{font-family:'Fraunces',serif;font-weight:300;font-size:clamp(2rem,5vw,3.4rem);line-height:1.25;max-width:20ch;margin:0 auto;color:#efe6cf}

  .team{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:50px;padding:80px 0 140px;max-width:760px;margin:0 auto}
  .member{text-align:center}
  .member .photo{width:100%;max-width:240px;aspect-ratio:1/1;margin:0 auto 24px;border-radius:50%;background-size:cover;background-position:center;border:1px solid rgba(255,255,255,.1)}
  .member h2{font-family:'Fraunces',serif;font-style:italic;font-weight:300;font-size:1.5rem}
  .member .role{color:var(--muted);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;margin-top:8px}

  .foot{text-align:center;padding:30px;font-size:.72rem;color:#5c5850;letter-spacing:.06em;border-top:1px solid #1a1814}
</style>
</head>
<body>
<a class="ver" href="index.html">← The Art</a>

<header class="hero">
  <div class="eyebrow">Rasta Roba · Studio</div>
  <h1>The people behind the work.</h1>
</header>

<section class="wrap">
  <div class="team">
    <div class="member">
      <div class="photo" style="background-image:url('images/team/songwa.jpg'),linear-gradient(160deg,var(--c1a),var(--c1b))"></div>
      <h2>Songwa</h2>
      <div class="role">Creative Director</div>
    </div>
  </div>
</section>

<div class="foot">© Rasta Roba — Studio.</div>
</body>
</html>
